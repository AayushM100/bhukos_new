<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background: #f9f6f4;">
  <!-- Dark Chocolate Bar - COMMON rarity -->
  <defs>
    <linearGradient id="chocBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#5d4037"/>
    </linearGradient>
    <filter id="chocGloss">
      <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background - soft cream -->
  <rect width="400" height="300" fill="#fff8f5"/>

  <!-- Chocolate bar wrapper -->
  <g transform="translate(200, 150)">
    <!-- Wrapper -->
    <rect x="-100" y="-40" width="200" height="80" rx="4" fill="url(#chocBody)"/>

    <!-- Gloss highlight -->
    <ellipse cx="-20" cy="-20" rx="45" ry="15" fill="url(#glossGrad)"/>

    <!-- Foil wrapper details -->
    <rect x="-100" y="-40" width="200" height="2" fill="#8b7355"/>
    <rect x="-100" y="30" width="200" height="2" fill="#8b7355"/>

    <!-- Brand strip -->
    <rect x="-90" y="-25" width="180" height="10" fill="#d4c8a1"/>
    <text x="0" y="-17" font-family="JetBrains Mono, monospace" font-size="8" fill="#3e2723" text-anchor="middle" font-weight="600">70%</text>

    <!-- Chunk texture -->
    <path d="M -60 0 L -30 20 L 0 0 L 30 -20 L 60 0 L 30 -20 L 0 0 Z" fill="#4e342e" opacity="0.4"/>
    <path d="M -30 0 L 0 15 L 30 0 L 15 -10 L -15 -10 Z" fill="#4e342e" opacity="0.4"/>
  </g>

  <!-- Subtle highlight on top -->
  <ellipse cx="200" cy="100" rx="95" ry="15" fill="#ffffff" opacity="0.05"/>
</svg>