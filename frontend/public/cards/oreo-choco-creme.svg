<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background: #fff1f2;">
  <!-- Oreo Choco Creme - EPIC rarity -->
  <defs>
    <radialGradient id="oreoBody" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </radialGradient>
    <linearGradient id="cremeFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8e4db"/>
      <stop offset="100%" stop-color="#f5f0e6"/>
    </linearGradient>
    <linearGradient id="chocFilling" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5d4037"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
  </defs>

  <!-- Background - light yellow tint for EPIC -->
  <rect width="400" height="300" fill="#fff8f5"/>

  <!-- Oreo Pack -->
  <g transform="translate(200, 150)">
    <!-- Pack body -->
    <rect x="-65" y="-55" width="130" height="65" rx="6" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="1.5"/>

    <!-- Pack top -->
    <rect x="-60" y="-65" width="120" height="10" fill="#e0e0e0" rx="2"/>

    <!-- Nabisco seal -->
    <circle cx="0" cy="-60" r="8" fill="#5d4037"/>
    <text x="0" y="-56" font-family="JetBrains Mono, monospace" font-size="6" fill="#fff" text-anchor="middle" font-weight="700">N</text>

    <!-- Oreo cookies -->
    <g fill="url(#oreoBody)">
      <!-- 4 cookies in a stack -->
      <rect x="-25" y="0" width="50" height="12" rx="2"/>
      <rect x="-25" y="15" width="50" height="12" rx="2"/>
      <rect x="-25" y="30" width="50" height="12" rx="2"/>
      <rect x="-25" y="45" width="50" height="12" rx="2"/>
    </g>

    <!-- Chocolate cream filling -->
    <rect x="-28" y="3" width="56" height="6" fill="url(#chocFilling)" rx="1"/>
    <rect x="-28" y="18" width="56" height="6" fill="url(#chocFilling)" rx="1"/>
    <rect x="-28" y="33" width="56" height="6" fill="url(#chocFilling)" rx="1"/>
    <rect x="-28" y="48" width="56" height="6" fill="url(#chocFilling)" rx="1"/>

    <!-- Oreo logo band -->
    <rect x="-55" y="55" width="110" height="8" fill="#d50000"/>
    <text x="0" y="60" font-family="JetBrains Mono, monospace" font-size="6" fill="#fff" text-anchor="middle" font-weight="700">OREO</text>
    <text x="0" y="68" font-family="JetBrains Mono, monospace" font-size="5" fill="#c62828" text-anchor="middle" font-weight="600">Choco Creme</text>
  </g>

  <!-- Cream swirl pattern -->
  <path d="M 180 180 C 175 170 185 160 190 170 C 195 160 205 170 200 180 C 195 190 185 195 180 190 C 175 195 165 190 170 180 Z" fill="#e8e4db" opacity="0.4"/>
</svg>