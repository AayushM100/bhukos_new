<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background: #1c191710;">
  <!-- Truffle Peanut Butter - LEGENDARY rarity -->
  <defs>
    <radialGradient id="truffleGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#5d4037"/>
    </radialGradient>
    <linearGradient id="pbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#856404"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
    <pattern id="goldFoil" patternUnits="userSpaceOnUse" width="8" height="8">
      <path d="M 0 4 L 8 4" stroke="#d4af37" stroke-width="1" opacity="0.4"/>
      <path d="M 4 0 L 4 8" stroke="#d4af37" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background - subtle dark accent for LEGENDARY -->
  <rect width="400" height="300" fill="#fff8f5"/>

  <!-- Truffle Peanut Butter Jar -->
  <g transform="translate(200, 150)">
    <!-- Jar body -->
    <rect x="-45" y="-55" width="90" height="70" rx="3" fill="url(#pbGrad)" stroke="#ffd600" stroke-width="2"/>

    <!-- Jar lid -->
    <rect x="-50" y="-65" width="100" height="10" fill="#8d6e63" rx="2"/>

    <!-- Lid band -->
    <rect x="-45" y="-62" width="90" height="4" fill="#ffd600"/>

    <!-- Label field -->
    <rect x="-40" y="-48" width="80" height="22" fill="none" stroke="#ffd600" stroke-width="0.5" rx="2"/>
    <rect x="-38" y="-46" width="76" height="18" fill="#fff" rx="2" opacity="0.9"/>

    <!-- Truffle text -->
    <text x="0" y="-35" font-family="JetBrains Mono, monospace" font-size="7" fill="#5d4037" text-anchor="middle" font-weight="600">TRUFFLE</text>
    <text x="0" y="-27" font-family="Playfair Display, serif" font-size="9" fill="#8d6e63" text-anchor="middle" font-weight="600" font-style="italic">Peanut</text>
    <text x="0" y="-18" font-family="JetBrains Mono, monospace" font-size="8" fill="#d4a017" text-anchor="middle" font-weight="700">Butter</text>

    <!-- Truffle pieces -->
    <g fill="url(#truffleGrad)">
      <ellipse cx="-25" cy="-20" rx="12" ry="8" transform="rotate(15)"/>
      <ellipse cx="25" cy="-15" rx="10" ry="7" transform="rotate(-10)"/>
      <ellipse cx="0" cy="5" rx="8" ry="6"/>
    </g>

    <!-- Truffle highlights -->
    <g fill="#ffd600">
      <ellipse cx="-25" cy="-20" rx="6" ry="4"/>
      <ellipse cx="25" cy="-15" rx="5" ry="3"/>
    </g>

    <!-- Peanut butter swirl -->
    <path d="M -35 0 C -30 10 -20 5 -15 15 C -10 5 -5 10 0 8 C 5 10 10 5 15 15 C 20 5 25 10 30 0" fill="none" stroke="#d4a017" stroke-width="2" stroke-linecap="round"/>

    <!-- Gold flecks -->
    <g fill="#d4af37">
      <circle cx="-70" cy="15" r="2"/>
      <circle cx="60" cy="5" r="1.5"/>
    </g>
  </g>

  <!-- Gold foil overlay for LEGENDARY effect -->
  <rect width="400" height="300" fill="url(#goldFoil)" opacity="0.15"/>

  <!-- Subtle highlight on top -->
  <ellipse cx="200" cy="80" rx="95" ry="12" fill="#ffffff" opacity="0.1"/>
</svg>