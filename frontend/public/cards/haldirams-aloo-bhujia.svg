<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background: #fffbeb;">
  <!-- Haldiram's Aloo Bhujia - LEGENDARY rarity -->
  <defs>
    <radialGradient id="bhujiaBody" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f5e0c3"/>
      <stop offset="100%" stop-color="#e0c097"/>
    </radialGradient>
    <linearGradient id="spicyOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f57c00"/>
      <stop offset="100%" stop-color="#fb8c00"/>
    </linearGradient>
    <pattern id="namkaarSpeck" patternUnits="userSpaceOnUse" width="4" height="4">
      <path d="M 2 2 L 2 4" stroke="#e65100" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background - light yellow tint for LEGENDARY -->
  <rect width="400" height="300" fill="#fff8f5"/>

  <!-- Haldiram's Bhujia Pack -->
  <g transform="translate(200, 150)">
    <!-- Pack body - traditional Indian style -->
    <path d="M -70 -60 L -50 -75 L 50 -75 L 70 -60 L 65 -55 L -65 -55 Z" fill="#ff9800" stroke="#ef6c00" stroke-width="1.5"/>

    <!-- Pack top -->
    <rect x="-60" y="-65" width="120" height="12" fill="#fff" rx="2"/>

    <!-- Haldiram's logo band -->
    <rect x="-55" y="-60" width="110" height="8" fill="#d32f2f"/>
    <rect x="-53" y="-58" width="106" height="6" fill="#b71c1c"/>

    <text x="0" y="-53" font-family="Playfair Display, serif" font-size="6" fill="#fff" text-anchor="middle" font-weight="600">HALDIRAM'S</text>
    <text x="0" y="-46" font-family="JetBrains Mono, monospace" font-size="5" fill="#ffcc80" text-anchor="middle" font-weight="700">ALOO BHUJIA</text>

    <!-- Snack bags - spiraled bhujia -->
    <g fill="url(#bhujiaBody)">
      <!-- 4 spiraled buns -->
      <path d="M -50 0 C -50 15 -35 20 -25 15 C -15 20 0 15 0 0 C 0 -15 -15 -20 -25 -15 C -35 -20 -50 -15 -50 0 Z"/>
      <path d="M -35 10 C -35 25 -20 30 -10 25 C 0 30 15 25 15 10 C 15 -5 0 -10 -10 -5 C -20 0 -35 5 -35 10 Z"/>
      <path d="M 15 5 C 15 20 30 25 40 20 C 50 25 65 20 65 5 C 65 -10 50 -15 40 -10 C 30 -5 15 0 15 5 Z"/>
      <path d="M 40 15 C 40 30 55 35 65 30 C 75 35 90 30 90 15 C 90 0 75 -5 65 0 C 55 5 40 10 40 15 Z"/>
    </g>

    <!-- Spicy coating -->
    <g fill="url(#spicyOrange)">
      <ellipse cx="-40" cy="-5" rx="15" ry="10"/>
      <ellipse cx="0" cy="5" rx="12" ry="8"/>
      <ellipse cx="40" cy="0" rx="15" ry="10"/>
    </g>

    <!-- Haldi (turmeric) yellow dots -->
    <g fill="#ffeb3b">
      <circle cx="-50" cy="25" r="2"/>
      <circle cx="0" cy="30" r="2"/>
      <circle cx="50" cy="20" r="2"/>
    </g>

    <!-- Flavor packet -->
    <g fill="#d32f2f">
      <rect x="-80" y="25" width="20" height="15" rx="2"/>
      <text x="-72" y="34" font-family="JetBrains Mono, monospace" font-size="5" fill="#fff" text-anchor="middle" font-weight="600">🔥</text>
    </g>
  </g>

  <!-- Namkaar speck overlay -->
  <rect width="400" height="300" fill="url(#namkaarSpeck)" opacity="0.1"/>
</svg>