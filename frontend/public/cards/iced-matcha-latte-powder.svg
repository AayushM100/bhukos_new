<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background: #f0fdf4;">
  <!-- Iced Matcha Latte Powder - UNCOMMON rarity -->
  <defs>
    <radialGradient id="matchaDust" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="100%" stop-color="#4caf50"/>
    </radialGradient>
    <pattern id="matchaSpeck" patternUnits="userSpaceOnUse" width="4" height="4">
      <circle cx="2" cy="2" r="1" fill="#388e3c" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background - sage green tint for UNCOMMON -->
  <rect width="400" height="300" fill="#fff8f5"/>

  <!-- Matcha Latte Powder -->
  <g transform="translate(200, 150)">
    <!-- Container -->
    <rect x="-65" y="-55" width="130" height="65" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>

    <!-- Container top -->
    <rect x="-70" y="-65" width="140" height="8" fill="#c8e6c9" rx="2"/>

    <!-- Powder fill gradient -->
    <rect x="-60" y="-50" width="120" height="50" fill="#81c784" opacity="0.8"/>

    <!-- Powder texture -->
    <g fill="#4caf50">
      <circle cx="-30" cy="-25" r="20" opacity="0.3"/>
      <circle cx="0" cy="-15" r="15" opacity="0.3"/>
      <circle cx="30" cy="-20" r="18" opacity="0.3"/>
    </g>

    <!-- Powder dust particles -->
    <g fill="#81c784" opacity="0.8">
      <circle cx="-50" cy="-65" r="3"/>
      <circle cx="45" cy="-55" r="2.5"/>
      <circle cx="60" cy="-70" r="2"/>
      <circle cx="-55" cy="-80" r="1.5"/>
    </g>

    <!-- Ice crystals -->
    <g fill="#ffffff" opacity="0.7">
      <polygon points="0,-45 -3,-42 -2,-38 2,-38 3,-42"/>
      <polygon points="25,-50 28,-47 27,-43 23,-43 22,-47"/>
      <polygon points="-30,-48 -33,-45 -32,-41 -28,-41 -27,-45"/>
    </g>

    <!-- Container label area -->
    <rect x="-50" y="-35" width="100" height="18" fill="none" stroke="#81c784" stroke-width="0.5" rx="2"/>
    <rect x="-48" y="-33" width="96" height="14" fill="#f1f8e9" rx="1.5"/>

    <!-- Label text (stylized) -->
    <text x="0" y="-25" font-family="Playfair Display, serif" font-size="8" fill="#2e7d32" text-anchor="middle" font-weight="600" font-style="italic">Matcha</text>
    <text x="0" y="-18" font-family="JetBrains Mono, monospace" font-size="6" fill="#4caf50" text-anchor="middle" font-weight="600">ICED</text>
  </g>

  <!-- Matcha speck overlay -->
  <rect width="400" height="300" fill="url(#matchaSpeck)" opacity="0.08"/>

  <!-- Subtle highlight on top -->
  <ellipse cx="200" cy="100" rx="95" ry="12" fill="#ffffff" opacity="0.1"/>
</svg>