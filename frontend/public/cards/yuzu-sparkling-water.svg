<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background: #fffbeb;">
  <!-- Yuzu Sparkling Water - EPIC rarity -->
  <defs>
    <radialGradient id="yuzuBody" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f0f4c3"/>
      <stop offset="100%" stop-color="#e6ee9c"/>
    </radialGradient>
    <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="bubblePattern" patternUnits="userSpaceOnUse" width="6" height="6">
      <circle cx="3" cy="3" r="1.5" fill="#ffffff" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background - light yellow tint for EPIC -->
  <rect width="400" height="300" fill="#fff8f5"/>

  <!-- Sparkling water -->
  <g transform="translate(200, 150)">
    <!-- Glass body -->
    <path d="M -70 -60 L -50 -80 L 50 -80 L 70 -60 L 55 -55 L -55 -55 Z" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>

    <!-- Glass base -->
    <rect x="-65" y="-55" width="130" height="8" rx="2" fill="#bbdefb"/>

    <!-- Glass reflection -->
    <path d="M -65 -60 L -55 -65 L 55 -65 L 65 -60" fill="url(#glassHighlight)"/>

    <!-- Yuzu slices -->
    <g fill="#fdd835">
      <ellipse cx="-40" cy="-35" rx="15" ry="8"/>
      <ellipse cx="40" cy="-45" rx="12" ry="7"/>
      <path d="M 0 -30 C -8 -28 -12 -20 -10 -15 C -8 -10 -2 0 10 -5 C 18 -10 22 -2 25 -5" fill="#fff176"/>
    </g>

    <!-- Yuzu segments -->
    <g fill="#f9a825">
      <path d="M 0 -30 L -25 -45 A 15 8 0 0 1 25 -45 A 15 8 0 0 1 0 -30 Z"/>
    </g>

    <!-- Bubbles -->
    <g fill="#ffffff">
      <circle cx="-30" cy="-10" r="4" opacity="0.8"/>
      <circle cx="-10" cy="0" r="3" opacity="0.7"/>
      <circle cx="20" cy="-5" r="3.5" opacity="0.8"/>
      <circle cx="45" cy="0" r="2.5" opacity="0.6"/>
      <circle cx="0" cy="15" r="2" opacity="0.5"/>
    </g>

    <!-- Sparkling highlights -->
    <g stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.5">
      <circle cx="-30" cy="-12" r="2"/>
      <circle cx="-50" cy="0" r="1.5"/>
      <circle cx="35" cy="5" r="1.5"/>
    </g>

    <!-- Lemon slice garnish -->
    <ellipse cx="80" cy="-20" rx="20" ry="6" fill="#ffeb3b" stroke="#fdd835" stroke-width="1"/>
  </g>

  <!-- Sparkle effects -->
  <g fill="#fff59d">
    <polygon points="280,50 285,65 300,65 290,75 285,90 280,75 270,75 280,65"/>
    <circle cx="320" cy="80" r="4" opacity="0.8"/>
  </g>

  <!-- Subtle highlight on top -->
  <ellipse cx="200" cy="70" rx="95" ry="12" fill="#ffffff" opacity="0.15"/>
</svg>