<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background: #fffbeb;">
  <!-- Red Bull Energy Drink - RARE rarity -->
  <defs>
    <radialGradient id="canBody" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#212121"/>
      <stop offset="100%" stop-color="#424242"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffeb3b"/>
      <stop offset="100%" stop-color="#fff176"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="100%" stop-color="#fff176"/>
    </linearGradient>
  </defs>

  <!-- Background - light yellow tint for RARE -->
  <rect width="400" height="300" fill="#fff8f5"/>

  <!-- Red Bull Can -->
  <g transform="translate(200, 150)">
    <!-- Can body -->
    <rect x="-45" y="-65" width="90" height="85" rx="2" fill="url(#canBody)"/>

    <!-- Top rim -->
    <path d="M -50 -70 L 50 -70 L 55 -65 L -55 -65 Z" fill="#212121"/>

    <!-- Red Bull logo band -->
    <rect x="-48" y="-60" width="96" height="12" fill="#fff"/>
    <rect x="-46" y="-58" width="92" height="8" fill="#ff0000"/>

    <text x="0" y="-50" font-family="Playfair Display, serif" font-size="7" fill="#212121" text-anchor="middle" font-weight="600">Red Bull</text>
    <text x="0" y="-41" font-family="JetBrains Mono, monospace" font-size="5" fill="#fff" text-anchor="middle" font-weight="600">Energy Drink</text>

    <!-- Wings symbol -->
    <g fill="#ff0000">
      <path d="M 0 0 C -15 5 -20 -5 -30 0 C -25 10 -15 15 -5 10 C -5 20 5 25 15 20 C 15 30 25 35 35 30 C 30 40 20 45 10 40"/>
    </g>

    <!-- Liquid waves -->
    <path d="M -45 30 Q -30 25 -20 30 Q -10 25 0 30 Q 10 25 20 30 Q 30 25 45 30" fill="url(#liquid)" opacity="0.8"/>
    <path d="M -40 35 Q -25 30 -15 35 Q -5 30 5 35 Q 15 30 25 35 Q 35 30 40 35" fill="url(#wave)" opacity="0.6"/>

    <!-- Ice crystals -->
    <g fill="#ffffff" opacity="0.7">
      <polygon points="0 45 -3 50 3 50 0 55"/>
      <polygon points="25 48 28 53 22 53 20 50"/>
    </g>

    <!-- Lightning effect -->
    <g fill="#ffeb3b" opacity="0.8">
      <polygon points="25 15 -20 15 -15 25 -10 18 -5 25 0 18 5 25 10 18 15 25 20 18 25 25"/>
    </g>
  </g>

  <!-- "Gives You Wings" text -->
  <text x="200" y="240" font-family="Playfair Display, serif" font-size="6" fill="#212121" text-anchor="middle" font-weight="500">Gives You Wings</text>
</svg>