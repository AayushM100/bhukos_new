<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background: #fff1f2;">
  <!-- Matcha White Chocolate Bark - RARE rarity -->
  <defs>
    <linearGradient id="whiteChoc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6e3"/>
      <stop offset="100%" stop-color="#f5f5dc"/>
    </linearGradient>
    <linearGradient id="matchaDust" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#81C784"/>
    </linearGradient>
  </defs>

  <!-- Background - soft pink tint for RARE -->
  <rect width="400" height="300" fill="#fff8f5"/>

  <!-- Chocolate bark -->
  <g transform="translate(200, 150)">
    <!-- White chocolate base -->
    <rect x="-90" y="-35" width="180" height="70" fill="url(#whiteChoc)" rx="4"/>

    <!-- Matcha drizzle -->
    <path d="M -70 -10 C -60 -20 -45 -15 -40 -25 C -35 -15 -20 -20 -15 -10 C -10 -20 0 -15 5 -25 C 10 -15 20 -20 25 -10 C 30 -20 40 -15 45 -25 C 50 -15 60 -20 65 -10" stroke="url(#matchaDust)" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Matcha swirls -->
    <path d="M -60 0 C -50 10 -40 5 -35 15 C -30 5 -20 10 -15 0" stroke="#43A047" stroke-width="2" fill="none"/>
    <path d="M 20 -15 C 28 -5 35 -10 40 0" stroke="#43A047" stroke-width="2" fill="none"/>

    <!-- Matcha dust particles -->
    <g fill="#4CAF50">
      <circle cx="-75" cy="-5" r="3"/>
      <circle cx="60" cy="15" r="2"/>
      <circle cx="35" cy="-20" r="2"/>
      <circle cx="-45" cy="5" r="3"/>
    </g>

    <!-- Serving pieces -->
    <g fill="url(#whiteChoc)" stroke="#e0d8d5" stroke-width="1">
      <rect x="-75" y="15" width="25" height="15" rx="2"/>
      <rect x="50" y="10" width="25" height="15" rx="2"/>
    </g>
  </g>

  <!-- Leaf garnish -->
  <g fill="#4CAF50">
    <path d="M 180 180 C 175 160 190 150 200 170 C 210 150 225 160 220 180 Z"/>
    <path d="M 215 145 C 210 130 225 125 232 138 C 238 125 250 130 245 145 Z"/>
  </g>

  <!-- Subtle highlight -->
  <ellipse cx="200" cy="80" rx="95" ry="15" fill="#ffffff" opacity="0.1"/>
</svg>